name: Build Android Stable Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Java 21 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Gradle Kurulumu
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Surum Numarasini Belirle
        run: |
          VERSION_NAME="1.4.${{ github.run_number }}"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

          sed -i 's/versionCode = .*/versionCode = '${{ github.run_number }}'/' app/build.gradle.kts
          sed -i 's/versionName = .*/versionName = "'"$VERSION_NAME"'"/' app/build.gradle.kts

      - name: Kasadan Kalici Anahtari Cikar
        env:
          R2_WORKER_URL: ${{ secrets.R2_WORKER_URL }}
          R2_API_TOKEN: ${{ secrets.R2_API_TOKEN }}
        run: |
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          fi

          # R2 yapilandirmasi (GitHub Secrets'tan)
          if [ -n "$R2_WORKER_URL" ] && [ -n "$R2_API_TOKEN" ]; then
            echo "" >> .env
            sed -i '/^R2_WORKER_URL=/d;/^R2_API_TOKEN=/d' .env
            echo "R2_WORKER_URL=$R2_WORKER_URL" >> .env
            echo "R2_API_TOKEN=$R2_API_TOKEN" >> .env
          fi

          # Kasadaki sabit anahtari cozer
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > debug.keystore

          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Sherpa ONNX Whisper Native Kutuphane Kontrolu
        run: |
          mkdir -p app/libs
          if [ ! -f "app/libs/sherpa-onnx-1.13.8.aar" ]; then
            echo "sherpa-onnx-1.13.8.aar bulunamadi, resmi GitHub surumunden indiriliyor..."
            curl -L -s -o app/libs/sherpa-onnx-1.13.8.aar "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar"
          fi
          ls -lh app/libs/

      - name: APK Derle
        run: ./gradlew assembleDebug --stacktrace

      - name: APK Dosyasini Hazirla
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk "release-output/Tufidesk-v${{ env.VERSION_NAME }}-stable.apk"
      - name: R2'ye Guncelleme Yukle
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          VC: ${{ github.run_number }}
        run: |
          APK="release-output/Tufidesk-v${VERSION_NAME}-stable.apk"
          KEY="updates/Tufidesk-v${VERSION_NAME}.apk"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK")
          aws s3 cp "$APK" "s3://tufidesk-files/$KEY" --endpoint-url "$R2_ENDPOINT"
          printf '{"versionName":"%s","versionCode":%s,"apkKey":"%s","sha256":"%s","size":%s}' \
            "$VERSION_NAME" "$VC" "$KEY" "$SHA" "$SIZE" > latest.json
          aws s3 cp latest.json "s3://tufidesk-files/updates/latest.json" \
            --endpoint-url "$R2_ENDPOINT" --content-type application/json
            
      - name: Otomatik Release Olustur ve Paylas
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION_NAME }}"
          name: "Tufidesk v${{ env.VERSION_NAME }} (Stable)"
          draft: false
          prerelease: false
          files: release-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
