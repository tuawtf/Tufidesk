name: Generate Permanent Keystore

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  create-key:
    runs-on: ubuntu-latest
    steps:
      - name: Sabit Anahtar Uret ve Metne Cevir
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Tufidesk, O=Tufi, C=TR"
          base64 -w 0 release.keystore > keystore_base64.txt

      - name: Anahtar Metnini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: keystore-secret-file
          path: keystore_base64.txt
