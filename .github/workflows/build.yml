name: Build Android Stable Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 21 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Gradle Kurulumu
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Surum Numarasini Belirle ve Uygula
        run: |
          # 1.2.X formatinda surum numarasi olustur
          VERSION_NAME="1.2.${{ github.run_number }}"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

          # build.gradle.kts icindeki versionCode ve versionName degerlerini guncelle
          sed -i 's/versionCode = .*/versionCode = '${{ github.run_number }}'/' app/build.gradle.kts
          sed -i 's/versionName = .*/versionName = "'"$VERSION_NAME"'"/' app/build.gradle.kts

      - name: Kalici Keystore Kontrolu
        run: |
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          fi

          # Depoda anahtar yoksa bir kez uret ve depoya kalici olarak yukle
          if [ ! -f "debug.keystore" ]; then
            echo "Keystore olusturuluyor..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Tufidesk,O=Tufidesk,C=TR"
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add debug.keystore
            git commit -m "ci: kalici keystore eklendi [skip ci]"
            git push
          else
            echo "Mevcut keystore kullaniliyor."
          fi

          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: APK Derle
        run: ./gradlew assembleDebug --stacktrace

      - name: APK Dosyasini Hazirla (Stable Olarak Yeniden Adlandir)
        run: |
          mkdir -p release-output
          # app-debug.apk adini Tufidesk-v1.2.X-stable.apk seklinde degistir
          cp app/build/outputs/apk/debug/*.apk "release-output/Tufidesk-v${{ env.VERSION_NAME }}-stable.apk"

      - name: Otomatik Release Olustur ve Stable APK Paylas
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION_NAME }}"
          name: "Tufidesk v${{ env.VERSION_NAME }} (Stable)"
          draft: false
          prerelease: false
          files: release-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
