<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <path d="M64 128 h384 M64 256 h384 M64 384 h384 M128 64 v384 M256 64 v384 M384 64 v384" stroke="white" stroke-opacity="0.06" stroke-width="2"/>
  
  <!-- Main Desk & Notebook Symbol -->
  <g filter="url(#shadow)">
    <!-- Clipboard / Tablet Base -->
    <rect x="136" y="106" width="240" height="310" rx="32" fill="#FFFFFF"/>
    
    <!-- Header Clip -->
    <rect x="206" y="86" width="100" height="40" rx="14" fill="#0F172A"/>
    <circle cx="256" cy="106" r="8" fill="#F8FAFC"/>
    
    <!-- Ruled Task Lines -->
    <circle cx="186" cy="180" r="14" fill="#10B981"/>
    <path d="M180 180 l4 4 l8 -8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="216" y="174" width="124" height="12" rx="6" fill="#94A3B8"/>
    
    <circle cx="186" cy="236" r="14" fill="#3B82F6"/>
    <path d="M180 236 l4 4 l8 -8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="216" y="230" width="96" height="12" rx="6" fill="#94A3B8"/>
    
    <circle cx="186" cy="292" r="14" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="3"/>
    <rect x="216" y="286" width="134" height="12" rx="6" fill="#CBD5E1"/>
    
    <circle cx="186" cy="348" r="14" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="3"/>
    <rect x="216" y="342" width="110" height="12" rx="6" fill="#CBD5E1"/>
  </g>
  
  <!-- Tufi AI Sparkle / Star Badge -->
  <g transform="translate(330, 290) scale(1.1)" filter="url(#shadow)">
    <circle cx="48" cy="48" r="44" fill="#0F172A" stroke="#38BDF8" stroke-width="4"/>
    <!-- 4-point Star -->
    <path d="M48 16 Q48 48 16 48 Q48 48 48 80 Q48 48 80 48 Q48 48 48 16 Z" fill="url(#starGrad)"/>
    <circle cx="48" cy="48" r="6" fill="#FFF"/>
  </g>
</svg>
